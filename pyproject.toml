[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-agent"
version = "0.1.0"
description = "AWS FinOps agent: resource inventory, TCO analysis, cost reduction and architectural recommendations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "moto[ec2,s3,cloudwatch,rds,elbv2,dynamodb,awslambda]>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
finops = "finops.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["finops*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
